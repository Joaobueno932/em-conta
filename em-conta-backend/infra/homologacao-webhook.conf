# Proxy do túnel de homologação (infra/homologacao-meta.sh tunel-abrir). Só a rota do webhook do
# WhatsApp chega à API de homologação; qualquer outro caminho recebe 404 e outro método recebe 403,
# sem tocar a API. O corpo e o X-Hub-Signature-256 seguem intactos (a API valida o HMAC do corpo bruto).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 64;
}

http {
  server_tokens off;
  # Sem a query string: a verificação da Meta traz o verify token em hub.verify_token. Pelo mesmo
  # motivo o log de erros fica só em "crit" (os níveis abaixo repetem a linha da requisição).
  log_format sem_consulta '$time_iso8601 $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout sem_consulta;

  # Sistema de arquivos somente leitura: temporários no tmpfs.
  client_body_temp_path /tmp/corpo;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 3m;

  # DNS do Docker: o endereço da API é resolvido a cada 10 s, então recriar a API não exige reabrir.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location = /api/v1/integracoes/whatsapp/webhook {
      limit_except GET POST {
        deny all;
      }
      set $api http://emconta-api-homolog:8080;
      # Caminho fixo: a API só recebe esta rota, seja qual for a forma do caminho pedido.
      proxy_pass $api/api/v1/integracoes/whatsapp/webhook$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    location / {
      return 404;
    }
  }
}
